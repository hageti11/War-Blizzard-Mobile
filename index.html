u003c/div>\n\u003cdiv id=\"aform\" style=\"display:none\">\u003cdiv class=\"tab\">\u003cbutton class=\"sb on\" id=\"tl\" onclick=\"authTab(0)\">ログイン\u003c/button>\u003cbutton class=\"sb\" id=\"tr\" onclick=\"authTab(1)\">新規登録\u003c/button>\u003c/div>\n\u003cdiv class=\"row\">\u003cinput id=\"an\" class=\"sb\" maxlength=\"12\" placeholder=\"表示名 (12文字まで)\" style=\"display:none\" autocomplete=\"nickname\">\u003c/div>\n\u003cdiv class=\"row\">\u003cinput id=\"ai\" class=\"sb\" maxlength=\"16\" placeholder=\"ユーザーID (英数字と_ 3〜16)\" autocomplete=\"username\" autocapitalize=\"none\">\u003c/div>\n\u003cdiv class=\"row\">\u003cinput id=\"ap\" class=\"sb\" type=\"password\" maxlength=\"64\" placeholder=\"パスワード (6文字以上)\" autocomplete=\"current-password\">\u003c/div>\n\u003cdiv class=\"err\" id=\"ae\">\u003c/div>\u003cdiv class=\"row\">\u003cbutton class=\"sb\" id=\"ago\" onclick=\"authGo()\">ログイン\u003c/button>\u003c/div>\n\u003cdiv class=\"sub\" id=\"amode\" style=\"margin-top:10px\">\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv id=\"fs\" class=\"ov\">\u003ch1>Modern WarAirs\u003c/h1>\u003cdiv id=\"prof\" class=\"sub\" style=\"font-size:13px\">\u003c/div>\n\u003cdiv class=\"sub\">陣営を選んで出撃。飛行場から発進し、空戦と地上攻撃でチケットを奪え。オンラインは同じルームコードの人と直接つながります(先に入った人が部屋の主)。\u003c/div>\n\u003cdiv class=\"row\">\u003cbutton class=\"sb\" onclick=\"pickF(0)\">日米英連合軍\u003cbr>(JP / US / UK)\u003c/button>\u003cbutton class=\"sb\" onclick=\"pickF(1)\">中露連合軍\u003cbr>(CN / RU)\u003c/button>\u003c/div>\n\u003cdiv class=\"row\">\u003cselect id=\"diff\" class=\"sb\">\u003coption value=\"0\">AI難易度: 易\u003c/option>\u003coption value=\"1\" selected>AI難易度: 普通\u003c/option>\u003coption value=\"2\">AI難易度: 難\u003c/option>\u003c/select>\u003cselect id=\"mode\" class=\"sb\">\u003coption value=\"0\" selected>空中戦 (WT式: 飛行場発進+地上攻撃・チケット制)\u003c/option>\u003coption value=\"1\">ドッグファイト (1v1・3撃墜先取)\u003c/option>\u003c/select>\u003cselect id=\"mapsel\" class=\"sb\">\u003c/select>\u003c/div>\n\u003cdiv class=\"row\">\u003cselect id=\"bf\" class=\"sb\">\u003coption value=\"3\">味方BOT: 3\u003c/option>\u003coption value=\"0\">味方BOT: 0\u003c/option>\u003coption value=\"1\">味方BOT: 1\u003c/option>\u003coption value=\"2\">味方BOT: 2\u003c/option>\u003coption value=\"4\" selected>味方BOT: 4\u003c/option>\u003coption value=\"5\">味方BOT: 5\u003c/option>\u003c/select>\u003cselect id=\"be\" class=\"sb\">\u003coption value=\"5\" selected>敵BOT: 5\u003c/option>\u003coption value=\"0\">敵BOT: 0\u003c/option>\u003coption value=\"2\">敵BOT: 2\u003c/option>\u003coption value=\"3\">敵BOT: 3\u003c/option>\u003coption value=\"4\">敵BOT: 4\u003c/option>\u003coption value=\"6\">敵BOT: 6\u003c/option>\u003c/select>\u003c/div>\n\u003cdiv class=\"row\">\u003cinput id=\"rc\" class=\"sb\" placeholder=\"ルームコード(任意)\" maxlength=\"16\" style=\"width:190px\">\u003cbutton class=\"sb\" id=\"onb\" onclick=\"toggleOn()\">オンライン: OFF\u003c/button>\u003cbutton class=\"sb\" id=\"qmb\" onclick=\"toggleQ()\">クイックマッチ: OFF\u003c/button>\u003c/div>\n\u003cdiv class=\"sub\" id=\"olmsg\">\u003c/div>\u003cdiv class=\"row\">\u003cbutton class=\"sb\" onclick=\"openSet2()\">⚙ 設定\u003c/button>\u003cbutton class=\"sb\" onclick=\"logout()\">ログアウト\u003c/button>\u003c/div>\u003c/div>\n\n\u003cdiv id=\"vs\" class=\"ov\">\u003ch1>機体選択\u003c/h1>\u003cdiv id=\"vwrap\">\u003cdiv id=\"vl\" class=\"vgrid\">\u003c/div>\u003cdiv id=\"vside\">\u003ccanvas id=\"pv\" width=\"420\" height=\"250\">\u003c/canvas>\u003cdiv id=\"vinfo\" style=\"font-size:12px;line-height:1.55;margin-top:8px\">\u003c/div>\u003cdiv class=\"sub\" id=\"vserr\" style=\"color:#f87171\">\u003c/div>\u003cdiv class=\"row\" style=\"justify-content:flex-start\">\u003cbutton class=\"sb\" onclick=\"backHome()\">◀ 戻る\u003c/button>\u003cbutton class=\"sb\" onclick=\"launch()\">▶ 出撃!\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv id=\"rs\" class=\"ov\" style=\"background:rgba(0,0,0,.9)\">\u003ch1 id=\"rt\" style=\"font-size:28px\">VICTORY\u003c/h1>\u003cdiv class=\"sub\" id=\"rsc\">\u003c/div>\u003cdiv id=\"rtab\">\u003c/div>\u003cdiv class=\"sub\" id=\"rlv\">\u003c/div>\u003cdiv class=\"row\">\u003cbutton class=\"sb\" onclick=\"goHome()\">🏠 ホームへ\u003c/button>\u003c/div>\u003c/div>\n\u003cdiv id=\"st\" class=\"ov\" style=\"background:rgba(4,8,14,.88);z-index:50\">\u003ch1>⚙ 設定 / 一時停止\u003c/h1>\u003cdiv class=\"sub\" id=\"stp\">\u003c/div>\u003cdiv id=\"stg\">\u003c/div>\u003cdiv class=\"row\">\u003cbutton class=\"sb\" onclick=\"closeSet()\">▶ 戻る\u003c/button>\u003cbutton class=\"sb\" id=\"hbtn\" onclick=\"homeBtn()\">🏠 ホームへ\u003c/button>\u003c/div>\u003c/div>\n\u003cdiv id=\"sbd\" class=\"ov\" onclick=\"showSB(0)\">\u003c/div>\u003cdiv id=\"tb\">\u003cdiv onclick=\"openSet()\">⚙\u003c/div>\u003cdiv onclick=\"showSB(sbOn?0:1)\">📋\u003c/div>\u003c/div>\u003cdiv id=\"rot\">📱↻ 画面を横向きにしてください\u003c/div>\u003cdiv id=\"rzv\">\u003c/div>\n\u003cscript src=\"https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js\">\u003c/script>\n\u003cscript src=\"https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js\">\u003c/script>\n\u003cscript src=\"https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js\">\u003c/script>\n\u003cscript src=\"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js\">\u003c/script>\n\u003cscript src=\"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js\">\u003c/script>\n\u003cscript src=\"config.js\">\u003c/script>\n\u003cscript>\nconst $=id=>document.getElementById(id),cl=(v,a,b)=>Math.max(a,Math.min(b,v)),esc=s=>String(s).replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c])),sleep=ms=>new Promise(r=>setTimeout(r,ms));\nconst V3=THREE.Vector3,Qn=THREE.Quaternion,PI=Math.PI,AXX=new V3(1,0,0),AXY=new V3(0,1,0);\nconst SET={vol:.7,sens:1,inv:0,res:1};try{Object.assign(SET,JSON.parse(localStorage.getItem('swb_set')||'{}'))}catch(e){}\nconst coarse=matchMedia('(pointer:coarse)').matches||navigator.maxTouchPoints>1;\n// ============================ 認証 (Firebase / ローカル) ============================\nconst FB={on:false,auth:null,db:null};\ntry{if(window.FB_CFG&&window.firebase){firebase.initializeApp(window.FB_CFG);FB.auth=firebase.auth();FB.db=firebase.firestore();FB.on=true}}catch(e){console.error(e)}\nlet ACC=null,NICK='';const ID_RE=/^[A-Za-z0-9_]{3,16}$/,mail=id=>id.toLowerCase()+'@swb-game.example.com';\nconst newProf=(name,id)=>({name,id:id.toLowerCase(),xp:0,sl:0,bt:0,wn:0,kl:0,dm:0});\nasync function sha(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of s)h=((h\u003c\u003c5)+h+c.charCodeAt(0))|0;return String(h)}}\nconst LS=()=>{try{return JSON.parse(localStorage.getItem('swb_local')||'{}')}catch(e){return{}}};\nfunction errJp(e){const c=e&&e.code||'';return({'auth/email-already-in-use':'そのユーザーIDは既に使われています','auth/wrong-password':'IDまたはパスワードが違います','auth/invalid-credential':'IDまたはパスワードが違います','auth/user-not-found':'IDまたはパスワードが違います','auth/invalid-login-credentials':'IDまたはパスワードが違います','auth/weak-password':'パスワードは6文字以上にしてください','auth/network-request-failed':'ネットワークに接続できません','auth/too-many-requests':'試行回数が多すぎます。しばらく待ってください','auth/operation-not-allowed':'Firebaseでメール/パスワード認証が有効になっていません'}[c])||(typeof e==='string'?e:'エラー: '+(e&&e.message||c))}\nasync function loadProf(u){let p=null;try{const d=await FB.db.collection('users').doc(u.uid).get();if(d.exists)p=d.data()}catch(e){console.error(e)}\nif(!p){p=newProf(u.displayName||'Pilot',(u.email||'').split('@')[0]);try{await FB.db.collection('users').doc(u.uid).set(p)}catch(e){}}return p}\nasync function doRegister(name,id,pw){name=name.trim().slice(0,12);if(!name)throw'表示名を入力してください';if(!ID_RE.test(id))throw'ユーザーIDは英数字と_で3〜16文字です';if(pw.length\u003c6)throw'パスワードは6文字以上にしてください';\nif(FB.on){const c=await FB.auth.createUserWithEmailAndPassword(mail(id),pw);try{await c.user.updateProfile({displayName:name})}catch(e){}cons se if(drag&&e.pointerId===drag.id){const dt=performance.now()-tapT;if(dt\u003c260&&hyp(e.clientX-tapX,e.clientY-tapY)\u003c14&&play())tapSelect(e.clientX,e.clientY);drag=null}});\n addEventListener('wheel',e=>{if(!play())return;if(S.cam.zoom>.3){return}S.cam.dist=clamp(S.cam.dist*(1+Math.sign(e.deltaY)*.08),.55,2.2)},{passive:true});\n document.addEventListener('pointerlockchange',()=>{if(document.pointerLockElement===cv)S.lockWanted=true;else{if(S.lockWanted&&(S.st==='play'||S.st==='dying')&&!S.paused)UI.pause();S.lockWanted=false}});\n document.addEventListener('visibilitychange',()=>{if(document.hidden&&(S.st==='play'||S.st==='dying'))UI.pause()})}\nfunction tapSelect(x,y){const p=S.pl;if(!p||!alive(p))return;let b=null,bd=80;for(const e of S.ships){if(e.team===S.team||!alive(e)||!spotted(e,S.team))continue;const q=proj(e.x,e.g.position.y+e.info.top*.5,e.z);if(!q.f)continue;const d=hyp(q.x-x,q.y-y);if(d\u003cbd){bd=d;b=e}}if(b){p.lock=b;S.lockT=0;AU.ui('lock')}}\n/* ---------- exports for hub ---------- */\nwindow.__vehs=()=>{WTL.init();return SHIPS.map(v=>({id:v.id,n:v.n,nat:v.nat,fac:v.fac,i:WTL.T[v.id],top:v.top,hp:v.hp,gun:v.gun,asm:v.asm,sam:v.sam,tor:v.tor,rd:v.rd,L:v.L,cls:v.cls}))};\nwindow.__model=id=>{const d=SHIP[id];if(!d)return null;return buildShip(d).g};\nwindow.__rad=id=>{const d=SHIP[id];return d?d.L*.95+25:80};\nwindow.__room=()=>{};\n/* ---------- boot ---------- */\nfunction boot(){\n if(innerWidth\u003c120)return;\n try{initRenderer()}catch(e){document.body.innerHTML='\u003cdiv style=\"padding:30px;font-family:sans-serif\">WebGLを初期化できませんでした: '+esc(e.message)+'\u003c/div>';return}\n UI.init();bindInput();let last={};try{last=JSON.parse(LS('wsea_last')||'{}')}catch(e){}\n if(last.m&&MODES[last.m])S.mode=last.m;if(last.map&&MAPS[last.map])S.mapId=last.map;if(last.wx&&WX[last.wx])S.wxId=last.wx;\n S.fac=last.fac||'0';S.team=teamOf(S.fac);const list=WTL.filt(byFac(S.fac),S.fac);S.defId=(last.def&&list.find(d=>d.id===last.def))?last.def:list[0].id;\n S.seats=[[],[]];S.zones=[];S.vis=[[],[]];hangarShow(SHIP[S.defId]);\n UI.loading(false);UI.faction();$('hud').style.display='none';requestAnimationFrame(frame)}\nif(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();\n\n\n\u003c/script>\n\u003c/body>\u003c/html>\n"</script>

{const _m=mdo;mdo=k=>k==='oc'?openchat():_m(k);const n=document.querySelector('.Ln');if(n){const b=document.createElement('button');b.setAttribute('onclick',"Hub.m('oc')");b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"/><path d="M8.5 11h7M8.5 14h4"/></svg><span>オプチャ</span>';n.appendChild(b)}}

x.save();x.translate(cx,cy);x.scale(1,.26);s=x.createRadialGradient(0,0,0,0,0,R*.5);s.addColorStop(0,'rgba(141,255,166,.2)');s.addColorStop(1,'rgba(141,255,166,0)');x.fillStyle=s;x.beginPath();x.arc(0,0,R*.5,0,6.283);x.fill();
for(let i=1;i<=4;i++){x.beginPath();x.arc(0,0,i*R*.11,0,6.283);x.strokeStyle='rgba(141,255,166,'+(.3-i*.05)+')';x.lineWidth=1.4;x.stroke()}
x.rotate(t*.00025);x.setLineDash([5,16]);x.beginPath();x.arc(0,0,R*.36,0,6.283);x.strokeStyle='rgba(255,207,102,.5)';x.lineWidth=1.6;x.stroke();x.restore();
x.fillStyle='rgba(210,240,225,.6)';for(const p of P){p.y-=p.v;if(p.y<0){p.y=hh;p.x=Math.random()*w}x.globalAlpha=.15+.4*Math.abs(Math.sin(t*.0008+p.a));x.fillRect(p.x,p.y,p.r,p.r)}x.globalAlpha=1;requestAnimationFrame(fr)})(0);
