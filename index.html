cdiv class=\"row\">\u003cinput id=\"ai\" class=\"sb\" maxlength=\"16\" placeholder=\"ユーザーID (英数字と_ 3〜16)\" autocomplete=\"username\" autocapitalize=\"none\">\u003c/div>\n\u003cdiv class=\"row\">\u003cinput id=\"ap\" class=\"sb\" type=\"password\" maxlength=\"64\" placeholder=\"パスワード (6文字以上)\" autocomplete=\"current-password\">\u003c/div>\n\u003cdiv class=\"err\" id=\"ae\">\u003c/div>\u003cdiv class=\"row\">\u003cbutton class=\"sb\" id=\"ago\" onclick=\"authGo()\">ログイン\u003c/button>\u003c/div>\n\u003cdiv class=\"sub\" id=\"amode\" style=\"margin-top:10px\">\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv id=\"fs\" class=\"ov\">\u003ch1>Modern WarAirs\u003c/h1>\u003cdiv id=\"prof\" class=\"sub\" style=\"font-size:13px\">\u003c/div>\n\u003cdiv class=\"sub\">陣営を選んで出撃。飛行場から発進し、空戦と地上攻撃でチケットを奪え。オンラインは同じルームコードの人と直接つながります(先に入った人が部屋の主)。\u003c/div>\n\u003cdiv class=\"row\">\u003cbutton class=\"sb\" onclick=\"pickF(0)\">日米英連合軍\u003cbr>(JP / US / UK)\u003c/button>\u003cbutton class=\"sb\" onclick=\"pickF(1)\">中露連合軍\u003cbr>(CN / RU)\u003c/button>\u003c/div>\n\u003cdiv class=\"row\">\u003cselect id=\"diff\" class=\"sb\">\u003coption value=\"0\">AI難易度: 易\u003c/option>\u003coption value=\"1\" selected>AI難易度: 普通\u003c/option>\u003coption value=\"2\">AI難易度: 難\u003c/option>\u003c/select>\u003cselect id=\"mode\" class=\"sb\">\u003coption value=\"0\" selected>空中戦 (WT式: 飛行場発進+地上攻撃・チケット制)\u003c/option>\u003coption value=\"1\">ドッグファイト (1v1・3撃墜先取)\u003c/option>\u003c/select>\u003cselect id=\"mapsel\" class=\"sb\">\u003c/select>\u003c/div>\n\u003cdiv class=\"row\">\u003cselect id=\"bf\" class=\"sb\">\u003coption value=\"3\">味方BOT: 3\u003c/option>\u003coption value=\"0\">味方BOT: 0\u003c/option>\u003coption value=\"1\">味方BOT: 1\u003c/option>\u003coption value=\"2\">味方BOT: 2\u003c/option>\u003coption value=\"4\" selected>味方BOT: 4\u003c/option>\u003coption value=\"5\">味方BOT: 5\u003c/option>\u003c/select>\u003cselect id=\"be\" class=\"sb\">\u003coption value=\"5\" selected>敵BOT: 5\u003c/option>\u003coption value=\"0\">敵BOT: 0\u003c/option>\u003coption value=\"2\">敵BOT: 2\u003c/option>\u003coption value=\"3\">敵BOT: 3\u003c/option>\u003coption value=\"4\">敵BOT: 4\u003c/option>\u003coption value=\"6\">敵BOT: 6\u003c/option>\u003c/select>\u003c/div>\n\u003cdiv class=\"row\">\u003cinput id=\"rc\" class=\"sb\" placeholder=\"ルームコード(任意)\" maxlength=\"16\" style=\"width:190px\">\u003cbutton class=\"sb\" id=\"onb\" onclick=\"toggleOn()\">オンライン: OFF\u003c/button>\u003cbutton class=\"sb\" id=\"qmb\" onclick=\"toggleQ()\">クイックマッチ: OFF\u003c/button>\u003c/div>\n\u003cdiv class=\"sub\" id=\"olmsg\">\u003c/div>\u003cdiv class=\"row\">\u003cbutton class=\"sb\" onclick=\"openSet2()\">⚙ 設定\u003c/button>\u003cbutton class=\"sb\" onclick=\"logout()\">ログアウト\u003c/button>\u003c/div>\u003c/div>\n\n\u003cdiv id=\"vs\" class=\"ov\">\u003ch1>機体選択\u003c/h1>\u003cdiv id=\"vwrap\">\u003cdiv id=\"vl\" class=\"vgrid\">\u003c/div>\u003cdiv id=\"vside\">\u003ccanvas id=\"pv\" width=\"420\" height=\"250\">\u003c/canvas>\u003cdiv id=\"vinfo\" style=\"font-size:12px;line-height:1.55;margin-top:8px\">\u003c/div>\u003cdiv class=\"sub\" id=\"vserr\" style=\"color:#f87171\">\u003c/div>\u003cdiv class=\"row\" style=\"justify-content:flex-start\">\u003cbutton class=\"sb\" onclick=\"backHome()\">◀ 戻る\u003c/button>\u003cbutton class=\"sb\" onclick=\"launch()\">▶ 出撃!\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv id=\"rs\" class=\"ov\" style=\"background:rgba(0,0,0,.9)\">\u003ch1 id=\"rt\" style=\"font-size:28px\">VICTORY\u003c/h1>\u003cdiv class=\"sub\" id=\"rsc\">\u003c/div>\u003cdiv id=\"rtab\">\u003c/div>\u003cdiv class=\"sub\" id=\"rlv\">\u003c/div>\u003cdiv class=\"row\">\u003cbutton class=\"sb\" onclick=\"goHome()\">🏠 ホームへ\u003c/button>\u003c/div>\u003c/div>\n\u003cdiv id=\"st\" class=\"ov\" style=\"background:rgba(4,8,14,.88);z-index:50\">\u003ch1>⚙ 設定 / 一時停止\u003c/h1>\u003cdiv class=\"sub\" id=\"stp\">\u003c/div>\u003cdiv id=\"stg\">\u003c/div>\u003cdiv class=\"row\">\u003cbu
